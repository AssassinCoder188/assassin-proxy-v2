
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Gateway</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 680px;
      margin: 12vh auto;
      padding: 24px;
      background: #111827;
      color: white;
    }
    input, button {
      box-sizing: border-box;
      padding: 12px;
      font: inherit;
      border-radius: 8px;
    }
    input { width: 75%; }
    button { cursor: pointer; }
    iframe {
      width: 100%;
      height: 55vh;
      margin-top: 24px;
      background: white;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Web Gateway</h1>
  <p>Browse an authorized destination.</p>

  <form id="browse">
    <input id="url" type="url"
      placeholder="https://example.com"
      required>
    <button>Open</button>
  </form>

  <p id="status" role="status"></p>
  <iframe id="viewer" title="Website preview"></iframe>

  <script>
    const WORKER_URL = "https://web-proxy.callanlyons10.workers.dev/";

    document.querySelector("#browse").addEventListener(
      "submit", async (event) => {
        event.preventDefault();

        const target = document.querySelector("#url").value;
        const status = document.querySelector("#status");

        try {
          const parsed = new URL(target);
          if (parsed.protocol !== "https:") {
            throw new Error("Use an HTTPS URL.");
          }

          const endpoint = new URL("/fetch", WORKER_URL);
          endpoint.searchParams.set("url", parsed.href);

          status.textContent = "Loading…";

          const response = await fetch(endpoint);
          if (!response.ok) {
            throw new Error("Request failed: " + response.status);
          }

          const type = response.headers.get("Content-Type") || "";
          if (!type.includes("text/html")) {
            throw new Error("This destination did not return HTML.");
          }

          const html = await response.text();
          const viewer = document.querySelector("#viewer");

          viewer.srcdoc = html;
          status.textContent =
            "Page received. Some websites may not render in a preview.";
        } catch (error) {
          status.textContent = error.message;
        }
      }
    );
  </script>
</body>
</html>
