services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      SEARXNG_URL: "http://searxng:8080"
      READER_ALLOWED_HOSTS: "${READER_ALLOWED_HOSTS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-0}"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      searxng:
        condition: service_healthy

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://localhost:8080/}"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in your deployment environment}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
