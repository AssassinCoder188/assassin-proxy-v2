name: Deploy and verify Assassin Search frontend

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify same-page metasearch frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "search form stays on this page": 'id="searchForm"' in html and "event.preventDefault()" in html,
              "backend search endpoint used": '"/api/search"' in html,
              "no direct navigation to DuckDuckGo": 'action="https://duckduckgo.com/"' not in html,
              "results rendered as text": "textContent" in html,
              "no query or result HTML injection": "innerHTML" not in html,
              "external links protected": 'rel = "noopener noreferrer"' in html,
          }
          for name, passed in checks.items():
              print(f'{"PASS" if passed else "FAIL"}: {name}')
          if not all(checks.values()):
              raise SystemExit("Assassin Search frontend verification failed.")
          PY
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
